<style>
    /* ═══════════════ 基础与布局 ═══════════════ */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --st-bg: #0d1117;
        --st-bg-2: #161b22;
        --st-bg-3: #21262d;
        --st-bg-inset: #010409;
        --st-border: #30363d;
        --st-border-2: #21262d;
        --st-fg: #e6edf3;
        --st-fg-2: #8b949e;
        --st-fg-3: #6e7681;
        --st-accent: #2f81f7;
        --st-accent-2: #58a6ff;
        --st-danger: #f85149;
        --st-success: #3fb950;
        --st-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    html, body { height: 100%; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        background: var(--st-bg);
        color: var(--st-fg);
        font-size: 14px;
        line-height: 1.5;
        overflow: hidden;
    }
    button { font: inherit; }
    input { font: inherit; }
    ::selection { background: rgba(88, 166, 255, .3); }

    /* ═══════════════ 顶部栏 ═══════════════ */
    .topbar {
        display: flex; align-items: center; gap: 16px;
        height: 56px; padding: 0 20px;
        background: var(--st-bg-2);
        border-bottom: 1px solid var(--st-border);
        flex-shrink: 0;
        user-select: none;
    }
    .topbar .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
    .topbar .logo svg { color: var(--st-accent-2); }
    .topbar .logo .sub { color: var(--st-fg-2); font-weight: 400; font-size: 12px; }
    .topbar .spacer { flex: 1; }
    .topbar .hint { font-size: 12px; color: var(--st-fg-3); }

    .btn {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 14px; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--st-border);
        background: var(--st-bg-3); color: var(--st-fg);
        font-size: 13px; font-weight: 500;
        transition: .15s;
        white-space: nowrap;
    }
    .btn:hover { border-color: var(--st-fg-3); background: #262c34; }
    .btn.primary {
        background: #238636; border-color: #2ea043; color: #fff;
    }
    .btn.primary:hover { background: #2ea043; }
    .btn.accent {
        background: var(--st-accent); border-color: var(--st-accent); color: #fff;
    }
    .btn.accent:hover { background: #1f6feb; }
    .btn.ghost { background: transparent; }
    .btn.ghost:hover { background: var(--st-bg-3); }
    .btn:active { transform: translateY(1px); }

    /* ═══════════════ 主体三栏 ═══════════════ */
    .layout {
        display: flex; height: calc(100vh - 56px);
        overflow: hidden;
    }

    /* ---- 左：编辑 ---- */
    .editor {
        width: 360px; min-width: 320px;
        display: flex; flex-direction: column;
        background: var(--st-bg-2);
        border-right: 1px solid var(--st-border);
        overflow: hidden;
    }
    .editor-scroll { flex: 1; overflow-y: auto; padding: 12px 14px 20px; }
    .editor-scroll::-webkit-scrollbar { width: 8px; }
    .editor-scroll::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

    .meta { display: flex; gap: 8px; margin-bottom: 14px; }
    .meta .field { flex: 1; }
    .meta label { display: block; font-size: 11px; color: var(--st-fg-3); margin-bottom: 3px; }
    .meta input {
        width: 100%; padding: 5px 8px;
        background: var(--st-bg-inset); border: 1px solid var(--st-border);
        border-radius: 6px; color: var(--st-fg); font-size: 13px;
    }
    .meta input:focus { outline: none; border-color: var(--st-accent); box-shadow: 0 0 0 3px rgba(47,129,247,.25); }
    .meta .field.t {
        flex: 0 0 96px;
    }
    .seg {
        display: flex; background: var(--st-bg-inset); border: 1px solid var(--st-border);
        border-radius: 6px; overflow: hidden;
    }
    .seg button {
        flex: 1; padding: 5px 8px; background: transparent; color: var(--st-fg-2);
        border: none; cursor: pointer; font-size: 12px;
    }
    .seg button.active { background: var(--st-bg-3); color: var(--st-fg); }

    /* 基底主题下拉 */
    .base-select {
        flex: 1; min-width: 0; padding: 5px 8px;
        background: var(--st-bg-inset); border: 1px solid var(--st-border);
        border-radius: 6px; color: var(--st-fg); font-size: 13px;
        cursor: pointer;
    }
    .base-select:focus { outline: none; border-color: var(--st-accent); }
    .base-select option, .base-select optgroup { background: var(--st-bg-2); color: var(--st-fg); }

    .grp { margin-bottom: 16px; }
    .grp-title {
        font-size: 11px; font-weight: 600; text-transform: uppercase;
        letter-spacing: .06em; color: var(--st-fg-3);
        margin-bottom: 2px;
        display: flex; align-items: center; gap: 6px;
    }
    .grp-title .chip {
        font-size: 10px; font-weight: 400; background: var(--st-bg-3);
        color: var(--st-fg-2); border-radius: 8px; padding: 0 6px;
        text-transform: none; letter-spacing: 0;
    }
    .token-row {
        display: flex; align-items: center; gap: 8px;
        padding: 6px 8px; border-radius: 8px; margin-top: 2px;
    }
    .token-row:hover { background: var(--st-bg-3); }
    .token-row .swatch {
        width: 30px; height: 22px; border-radius: 5px; cursor: pointer;
        border: 1px solid var(--st-border-2); flex-shrink: 0;
        position: relative; overflow: hidden;
    }
    .token-row .swatch input[type=color] {
        position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .token-row .lbl { flex: 1; }
    .token-row .lbl .k { font-size: 13px; font-family: var(--st-mono); color: var(--st-fg); }
    .token-row .lbl .d { font-size: 10px; color: var(--st-fg-3); }
    .token-row .hex {
        width: 76px; padding: 3px 6px;
        background: var(--st-bg-inset); border: 1px solid var(--st-border);
        border-radius: 5px; color: var(--st-fg); font-family: var(--st-mono);
        font-size: 12px; text-transform: uppercase; text-align: center;
    }
    .token-row .hex:focus { outline: none; border-color: var(--st-accent); }
    .token-row .hex.err { border-color: var(--st-danger); color: var(--st-danger); }

    /* 对比度徽标 */
    .ca-badge {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 10px; padding: 1px 7px; border-radius: 9px;
        border: 1px solid var(--st-border);
    }
    .ca-badge.ok { color: var(--st-success); border-color: rgba(63,185,80,.4); background: rgba(63,185,80,.08); }
    .ca-badge.warn { color: #d29922; border-color: rgba(210,153,34,.4); background: rgba(210,153,34,.08); }
    .ca-badge.bad { color: var(--st-danger); border-color: rgba(248,81,73,.4); background: rgba(248,81,73,.08); }

    /* ---- 中：预览 ---- */
    .preview-pane {
        flex: 1; display: flex; flex-direction: column; min-width: 420px;
        background: var(--st-bg-inset); overflow: hidden;
    }
    .preview-tabs {
        display: flex; align-items: center; gap: 2px;
        padding: 0 14px; height: 40px; flex-shrink: 0;
        border-bottom: 1px solid var(--st-border);
        background: var(--st-bg-2);
        overflow-x: auto;
    }
    .preview-tabs::-webkit-scrollbar { display: none; }
    .ptab {
        padding: 6px 14px; border-radius: 6px; cursor: pointer;
        font-size: 12px; color: var(--st-fg-2); white-space: nowrap;
        border: none; background: transparent;
    }
    .ptab:hover { color: var(--st-fg); }
    .ptab.active { color: var(--st-fg); background: var(--st-bg-3); }
    .preview-stage {
        flex: 1; overflow: auto; padding: 22px 26px;
        display: flex; justify-content: center;
    }
    .preview-stage::-webkit-scrollbar { width: 8px; height: 8px; }
    .preview-stage::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

    /* 预览设备框 —— 真实场景在 Shadow DOM 中渲染（#ghs-root），此处只做外框 */
    .device {
        width: 860px; max-width: 100%; height: auto;
        border-radius: 12px; overflow: hidden;
        border: 1px solid var(--st-border-2);
        box-shadow: 0 18px 50px rgba(1,4,9,.55);
        align-self: flex-start;
        background: var(--st-bg-2);
    }
    /* ---- 右：输出 ---- */
    .output {
        width: 420px; min-width: 360px;
        display: flex; flex-direction: column;
        background: var(--st-bg-2);
        border-left: 1px solid var(--st-border);
    }
    .output-head {
        display: flex; align-items: center; gap: 8px;
        padding: 10px 14px; border-bottom: 1px solid var(--st-border);
        flex-shrink: 0;
    }
    .output-head .t { font-weight: 600; font-size: 13px; flex: 1; }
    .output-head .status { font-size: 11px; color: var(--st-fg-3); }
    .output-body { flex: 1; overflow: auto; }
    .output-body pre {
        margin: 0; padding: 14px 16px;
        font-family: var(--st-mono); font-size: 12px; line-height: 1.55;
        color: #c9d1d9; white-space: pre; overflow: auto;
    }
    .output-body::-webkit-scrollbar, .output-body pre::-webkit-scrollbar { width: 8px; height: 8px; }
    .output-body::-webkit-scrollbar-thumb, .output-body pre::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
    .output-foot {
        display: flex; gap: 8px; padding: 10px 14px;
        border-top: 1px solid var(--st-border); flex-shrink: 0;
        flex-wrap: wrap;
    }
    .toast {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
        background: #24292f; color: #fff; padding: 9px 20px; border-radius: 8px;
        font-size: 13px; z-index: 99; opacity: 0;
        transition: .25s; box-shadow: 0 8px 24px rgba(0,0,0,.35);
        pointer-events: none;
    }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 空输出提示 */
    .code-empty {
        padding: 30px 20px; text-align: center; color: var(--st-fg-3); font-size: 13px;
    }
    @media (max-width: 1200px) {
        .layout { flex-wrap: wrap; overflow-y: auto; height: auto; }
        .editor { width: 100%; min-width: 0; border-right: none; border-bottom: 1px solid var(--st-border); height: 50vh; }
        .preview-pane { width: 100%; min-width: 0; height: 70vh; }
        .output { width: 100%; min-width: 0; border-left: none; border-top: 1px solid var(--st-border); height: 45vh; }
        body { overflow: auto; }
    }
</style>
</head>

'use strict';

function ghGenVars(t) {
        // 衍生色值
        const accentHover    = ghLightenOrDarken(t.bgDefault, t.accent, 0.12);
        const accentActive   = ghLightenOrDarken(t.bgDefault, t.accent, 0.18);
        const accentSubtle   = ghHexToRgba(t.accent, 0.12);
        const accentMuted    = ghHexToRgba(t.accent, 0.30);
        const dangerSubtle   = ghHexToRgba(t.danger, 0.10);
        const dangerMuted    = ghHexToRgba(t.danger, 0.30);
        const successSubtle  = ghHexToRgba(t.success, 0.10);
        const successMuted   = ghHexToRgba(t.success, 0.30);
        const warningSubtle  = ghHexToRgba(t.warning, 0.10);
        const warningMuted   = ghHexToRgba(t.warning, 0.30);
        const doneSubtle     = ghHexToRgba(t.done, 0.10);
        const doneMuted      = ghHexToRgba(t.done, 0.30);
        const borderMuted    = ghHexToRgba(t.border, 0.55);
        const borderSubtle   = ghHexToRgba(t.border, 0.35);
        const btnHover       = ghAdjustBrightness(t.bgSubtle, t.type === 'dark' ? 8 : -4);

function ghHexToRgba(hex, alpha) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r},${g},${b},${alpha})`;
    }
function ghLightenOrDarken(bg, color, amount) {
        // amount > 0 → 在暗色背景上变亮 / 亮色背景上变暗（"更强烈"）
        // 简单实现：混合黑色或白色
        const r = parseInt(color.slice(1, 3), 16);
        const g = parseInt(color.slice(3, 5), 16);
        const b = parseInt(color.slice(5, 7), 16);
        const bgR = parseInt(bg.slice(1, 3), 16);
        const bgG = parseInt(bg.slice(3, 5), 16);
        const bgB = parseInt(bg.slice(5, 7), 16);
        const bgLum = (bgR * 0.299 + bgG * 0.587 + bgB * 0.114);
        const isDark = bgLum < 128;
        const factor = isDark ? 1 + amount : 1 - amount;
        const nr = Math.min(255, Math.max(0, Math.round(r * factor)));
        const ng = Math.min(255, Math.max(0, Math.round(g * factor)));
        const nb = Math.min(255, Math.max(0, Math.round(b * factor)));
        return '#' + [nr, ng, nb].map(c => c.toString(16).padStart(2, '0')).join('');
    }
function ghAdjustBrightness(hex, amount) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        const nr = Math.min(255, Math.max(0, r + amount));
        const ng = Math.min(255, Math.max(0, g + amount));
        const nb = Math.min(255, Math.max(0, b + amount));
        return '#' + [nr, ng, nb].map(c => c.toString(16).padStart(2, '0')).join('');
    }

/* 颜色工具 —— 与 GithubTheme.js 算法一致 */
function hexToRgb(hex) {
    let h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function rgbToHex(r, g, b) {
    const c = v => Math.min(255, Math.max(0, Math.round(v))).toString(16).padStart(2, '0');
    return '#' + c(r) + c(g) + c(b);
}
function isDark(bgHex) {
    const { r, g, b } = hexToRgb(bgHex);
    return (r * 0.299 + g * 0.587 + b * 0.114) < 128;
}
function mix(a, b, t) {
    const A = hexToRgb(a), B = hexToRgb(b);
    return rgbToHex(A.r + (B.r - A.r) * t, A.g + (B.g - A.g) * t, A.b + (B.b - A.b) * t);
}
function alpha(hex, a) {
    const { r, g, b } = hexToRgb(hex);
    return `rgba(${r},${g},${b},${a})`;
}
/* 与主脚本 lightenOrDarken 同向：暗底提亮 1+a、亮底压暗 1-a */
function lightenOrDarken(bg, color, amount) {
    const A = hexToRgb(bg);
    const f = isDark(bg) ? 1 + amount : 1 - amount;
    return rgbToHex(hexToRgb(color).r * f, hexToRgb(color).g * f, hexToRgb(color).b * f);
}
function adjustBrightness(hex, amount) {
    const c = hexToRgb(hex);
    return rgbToHex(c.r + amount, c.g + amount, c.b + amount);
}
/* WCAG 对比度 */
function luminance(hex) {
    const { r, g, b } = hexToRgb(hex);
    const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
    return .2126 * f(r) + .7152 * f(g) + .0722 * f(b);
}
function contrast(a, b) {
    const L1 = luminance(a), L2 = luminance(b);
    const [hi, lo] = L1 > L2 ? [L1, L2] : [L2, L1];
    return (hi + .05) / (lo + .05);
}
function caLevel(ratio) {
    if (ratio >= 4.5) return { cls: 'ok', txt: 'AA ' + ratio.toFixed(1) };
    if (ratio >= 3) return { cls: 'warn', txt: 'A ' + ratio.toFixed(1) };
    return { cls: 'bad', txt: ratio.toFixed(1) };
}

const TOKEN_FIELD_ORDER = ['bgDefault','bgSubtle','bgInset','bgEmphasis','fgDefault','fgMuted','fgSubtle','fgOnEmphasis','accent','success','danger','warning','done','headerBg','headerFg','codeBg','border','link'];

function buildEditor() {
    const container = document.getElementById('token-groups');
    container.innerHTML = '';
    bindings = [];

    GROUPS.forEach(grp => {
        const sec = document.createElement('div');
        sec.className = 'grp';
        const title = document.createElement('div');
        title.className = 'grp-title';
        title.innerHTML = grp.label + ' <span class="chip">' + grp.desc + '</span>';
        sec.appendChild(title);

        grp.fields.forEach(([field, desc]) => {
            const row = document.createElement('div');
            row.className = 'token-row';

            const swatch = document.createElement('div');
            swatch.className = 'swatch';
            swatch.style.background = state.tokens[field];
            const picker = document.createElement('input');
            picker.type = 'color';
            picker.value = normalize(state.tokens[field]);
            swatch.appendChild(picker);

            const lbl = document.createElement('div');
            lbl.className = 'lbl';
            const k = document.createElement('div');
            k.className = 'k';
            k.textContent = field;
            lbl.appendChild(k);

            const hex = document.createElement('input');
            hex.className = 'hex';
            hex.value = state.tokens[field];
            hex.spellcheck = false;

            row.appendChild(swatch);
            row.appendChild(lbl);
            row.appendChild(hex);

            // 仅给两个关键可读性对照加对比度徽标
            let caEl = null;
            if (field === 'fgDefault') {
                caEl = document.createElement('span');
                caEl.className = 'ca-badge';
                caEl.dataset.for = 'fgDefault-vs-bg';
                row.appendChild(caEl);
            } else if (field === 'fgOnEmphasis') {
                caEl = document.createElement('span');
                caEl.className = 'ca-badge';
                caEl.dataset.for = 'fgOnEmphasis-vs-accent';
                row.appendChild(caEl);
            }

            sec.appendChild(row);
            bindings.push({ field, swatch, hex, caEl });
        });
        container.appendChild(sec);
    });
}

// 事件委托只绑定一次（bindings 为模块级引用，重建后依然有效）
function bindTokenEvents() {
    const groups = document.getElementById('token-groups');
    groups.addEventListener('input', (e) => {
        const target = e.target;
        if (target.type === 'color' || target.classList.contains('hex')) {
            const b = bindings.find(x => x.hex === target || x.swatch.querySelector('input') === target);
            if (!b) return;
            const val = target.type === 'color' ? target.value : normalize(target.value);
            if (val) commitToken(b.field, val);
        }
    });
    groups.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.classList.contains('hex')) {
            const b = bindings.find(x => x.hex === e.target);
            if (b) commitToken(b.field, normalize(e.target.value), true);
        }
    });
}

function normalize(h) {
    if (!h) return null;
    let v = h.trim();
    if (/^[0-9a-fA-F]{6}$/.test(v)) return '#' + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) return v;
    if (/^[0-9a-fA-F]{3}$/.test(v)) return '#' + v;
    if (/^#[0-9a-fA-F]{3}$/.test(v)) return '#' + v[1] + v[1] + v[2] + v[2] + v[3] + v[3];
    return null;
}

function commitToken(field, val, force) {
    const b = bindings.find(x => x.field === field);
    if (!val) {
        if (b) b.hex.classList.add('err');
        return;
    }
    if (b) {
        b.hex.classList.remove('err');
        b.hex.value = val;
        b.swatch.style.background = val;
        const picker = b.swatch.querySelector('input');
        if (picker) picker.value = val;
    }
    if (state.tokens[field] !== val || force) {
        state.tokens[field] = val;
        scheduleUpdate();
    }
}

function oct(name, cls, size) {
    const w = size || 16;
    const c = cls ? ' ' + cls : '';
    return `<svg class="octicon octicon-${name}${c}" width="${w}" height="${w}" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="${OCT[name]}"></path></svg>`;
}

const GH_MONO = 'ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace';
const GH_UI = '-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif';

/* ---------- Shadow DOM 内静态样式（真实 Primer 组件类） ---------- */
const PREVIEW_CSS = `
    .ghs {
        font-family: ${GH_UI};
        font-size: 14px;

    /* ── GitHub 布局工具类（Primer utilities 子集） ── */
    .d-flex { display: flex; } .flex-1 { flex: 1 1 auto; } .flex-auto { flex: auto; }

    .flex-shrink-0 { flex-shrink: 0; } .flex-items-center { align-items: center; }

    .flex-justify-between { justify-content: space-between; } .flex-justify-end { justify-content: flex-end; }
    .flex-justify-center { justify-content: center; }
    .text-small { font-size: 12px !important; } .text-bold { font-weight: 600 !important; }
    .text-normal { font-weight: 400 !important; } .text-mono { font-family: ${GH_MONO} !important; }

    .wb-break-all { word-break: break-all; }
    .overflow-hidden { overflow: hidden; } .v-align-middle { vertical-align: middle; }
    .mr-1 { margin-right: 4px !important; } .mr-2 { margin-right: 8px !important; } .mr-3 { margin-right: 16px !important; }
    .ml-1 { margin-left: 4px !important; } .ml-2 { margin-left: 8px !important; } .ml-3 { margin-left: 16px !important; }

    .mb-1 { margin-bottom: 4px !important; } .mb-2 { margin-bottom: 8px !important; } .mb-3 { margin-bottom: 16px !important; }
    .mx-2 { margin-left: 8px !important; margin-right: 8px !important; }
    .px-1 { padding-left: 4px !important; padding-right: 4px !important; }
    .px-2 { padding-left: 8px !important; padding-right: 8px !important; }
    .px-3 { padding-left: 16px !important; padding-right: 16px !important; }
    .py-1 { padding-top: 4px !important; padding-bottom: 4px !important; }
    .py-2 { padding-top: 8px !important; padding-bottom: 8px !important; }
    .p-0 { padding: 0 !important; } .p-2 { padding: 8px !important; } .p-3 { padding: 16px !important; }
    .position-relative { position: relative; }
    .color-fg-default { color: var(--fgColor-default) !important; }
    .color-fg-muted { color: var(--fgColor-muted) !important; }
    .color-fg-subtle { color: var(--fgColor-subtle) !important; }
    .color-fg-accent { color: var(--fgColor-accent) !important; }
    .color-fg-success { color: var(--fgColor-success) !important; }
    .color-fg-danger { color: var(--fgColor-danger) !important; }
    .color-fg-done { color: var(--fgColor-done) !important; }
    .color-fg-attention { color: var(--fgColor-attention) !important; }
    .color-fg-onEmphasis { color: var(--fgColor-onEmphasis) !important; }

    /* UA reset：Shadow DOM 不继承主文档 reset，<ul>/<ol> 自带 40px 缩进与外边距 */

    /* ── 全局 Header（经典 Primer .Header + GitHub 全局导航） ── */
    .ghs .Header {
        display: flex; align-items: center; gap: 12px;
        height: 60px; padding: 0 24px;

        color: var(--header-fgColor-default);
        border-bottom: 1px solid var(--header-borderColor-divider, transparent);
        flex-shrink: 0;
    }
    .ghs .Header-link { color: var(--header-fgColor-logo); display: inline-flex; }
    .ghs .Header-logo { color: var(--header-fgColor-logo); display: inline-flex; margin-right: 6px; }
    .ghs .Header-item { display: flex; align-items: center; }
    .ghs .Header-search {
        display: flex; align-items: center; gap: 8px;
        width: min(400px, 100%);
        height: 32px; padding: 0 12px;
        border-radius: 100px;
        background: var(--headerSearch-bgColor, rgba(255,255,255,.08));
        border: 1px solid var(--headerSearch-borderColor, transparent);

    }
    .ghs .Header-search .ph { opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ghs .Header-search .divider {
        width: 1px; height: 20px; flex-shrink: 0;
        background: currentColor; opacity: .25;
    }
    .ghs .Header-search .scope {
        font-weight: 500; white-space: nowrap; flex-shrink: 0;
    }
    .ghs .Header-search kbd {
        margin-left: auto; font-size: 11px; font-family: ${GH_MONO};
        border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
        border-radius: 5px; padding: 0 5px;
        color: var(--header-fgColor-default);
    }
    .ghs .Header-actions { display: flex; align-items: center; gap: 14px; margin-left: auto; }
    .ghs .Header-actions .icon-link { color: var(--header-fgColor-default); opacity: .9; display: inline-flex; }
    .ghs .avatar-mock {
        width: 20px; height: 20px; border-radius: 50%;
        background: var(--header-fgColor-logo);
        font-size: 10px; font-weight: 600; line-height: 20px; text-align: center;
        color: var(--header-bgColor); user-select: none;
    }

    /* ── 仓库本地栏（面包屑 + 操作 + UnderlineNav） ── */
    .ghs .local {
        background: var(--bgColor-default);
        border-bottom: 1px solid var(--borderColor-muted);
        padding: 14px 24px 0;
    }
    .ghs .local .inner { max-width: 980px; margin: 0 auto; }
    .ghs .breadcrumb-row { display: flex; align-items: center; gap: 6px; }
    .ghs .breadcrumb-row .repo-name { font-weight: 600; }
    .ghs .breadcrumb-row .actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

    /* ── 按钮（Primer .btn 系，含语义变体） ── */
    .ghs .btn {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 12px; font-size: 14px; font-weight: 500; line-height: 20px;
        border-radius: 6px; border: 1px solid transparent; cursor: pointer;
        background: var(--button-default-bgColor-rest, var(--bgColor-muted));
        border-color: var(--button-default-borderColor-rest, var(--borderColor-default));
        color: var(--button-default-fgColor-rest, var(--fgColor-default));
        transition: background-color .1s ease;
        white-space: nowrap;
    }
    .ghs .btn:hover {
        background: var(--button-default-bgColor-hover, var(--bgColor-muted));
        border-color: var(--button-default-borderColor-hover, var(--borderColor-muted));
        text-decoration: none;
    }
    .ghs .btn .btn-octicon { color: var(--fgColor-muted); }
    .ghs .btn-sm { padding: 3px 10px; font-size: 12px; line-height: 18px; }
    .ghs .btn-static { pointer-events: none; }
    .ghs .btn-primary {
        background: var(--button-primary-bgColor-rest, var(--bgColor-accent-emphasis));
        border-color: var(--button-primary-borderColor-rest, var(--bgColor-accent-emphasis));
        color: var(--button-primary-fgColor-rest, var(--fgColor-onEmphasis));
    }
    .ghs .btn-primary:hover {
        background: var(--button-primary-bgColor-hover, var(--bgColor-accent-emphasis));
        filter: brightness(.92);
    }
    .ghs .btn-primary .btn-octicon { color: var(--button-primary-fgColor-rest, var(--fgColor-onEmphasis)); }

    /* ── UnderlineNav（仓库页签） ── */
    .ghs .UnderlineNav {
        display: flex; align-items: flex-end; justify-content: space-between;
        margin-top: 12px;
        box-shadow: inset 0 -1px 0 var(--borderColor-muted);
    }
    .ghs .UnderlineNav-body { display: flex; gap: 2px; overflow-x: auto; }
    .ghs .UnderlineNav-item {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 8px 10px; margin-bottom: -1px;
        font-size: 14px; line-height: 24px; color: var(--fgColor-muted);
        border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0;
        white-space: nowrap;
    }
    .ghs .UnderlineNav-item:hover { color: var(--fgColor-default); text-decoration: none; }
    .ghs .UnderlineNav-item.selected { color: var(--fgColor-default); border-bottom-color: var(--fgColor-default); font-weight: 500; }
    .ghs .UnderlineNav-actions { display: flex; align-items: center; gap: 8px; padding-bottom: 4px; margin-left: 12px; }

    /* ── Counter / Label / 徽章 ── */
    .ghs .Counter {
        display: inline-block; min-width: 18px; padding: 0 6px;
        font-size: 12px; font-weight: 500; line-height: 18px; text-align: center;
        border-radius: 20px; background: var(--bgColor-neutral-muted);
        color: var(--fgColor-muted);
    }
    .ghs .Label {
        display: inline-block; padding: 0 8px; font-size: 12px; font-weight: 500;
        line-height: 20px; border-radius: 100px; border: 1px solid transparent;
    }
    .ghs .Label--secondary { color: var(--fgColor-muted); border-color: var(--borderColor-default); }
    .ghs .Label--success { color: var(--fgColor-success); background: var(--bgColor-success-muted); border-color: var(--borderColor-success-emphasis, transparent); }
    .ghs .Label--danger { color: var(--fgColor-danger); background: var(--bgColor-danger-muted); border-color: var(--borderColor-danger-emphasis, transparent); }
    .ghs .Label--accent { color: var(--fgColor-accent); background: var(--bgColor-accent-muted); border-color: var(--borderColor-accent-emphasis, transparent); }
    .ghs .Label--done { color: var(--fgColor-done); background: var(--bgColor-done-muted); border-color: transparent; }
    .ghs .Label--attention { color: var(--fgColor-attention); background: var(--bgColor-attention-muted); border-color: transparent; }
    .ghs .Label--neutral { color: var(--fgColor-muted); background: var(--bgColor-neutral-muted); }

    /* ── Release 资产平台图标色（与主脚本 PLATFORM_COLORS 对齐，固定常量非主题 token） ──
       .ghs .octicon.ri.ri-* = (0,4,0)，压过 .ghs .Box-row .octicon (0,3,0) 的 muted 色 */
    .ghs .octicon.ri { height: 1lh; }
    .ghs .octicon.ri.ri-windows { color: #0078d4; }
    .ghs .octicon.ri.ri-mac     { color: #8e8e93; }
    .ghs .octicon.ri.ri-linux   { color: #f5803e; }
    .ghs .octicon.ri.ri-android { color: #3ddc84; }
    .ghs .octicon.ri.ri-ios     { color: #5e5ce6; }

    /* ── Box 家族 ── */
    .ghs .Box { border: 1px solid var(--borderColor-default); border-radius: 6px; background: var(--bgColor-default); }
    .ghs .Box--condensed { border-radius: 0; border-left: 0; border-right: 0; }
    /* Box--condensed 作为 release Box 的收尾段：与主体齐平（无侧边距/无边距），补回底部圆角 */
    .ghs .Box > .Box--condensed:last-child { border-bottom: 0; border-radius: 0 0 6px 6px; }
    .ghs .Box > .Box--condensed:last-child .Box-header { border-radius: 0; }
    .ghs .Box--condensed .Box-row { padding: 8px 8px; }
    .ghs .Box-header { display: flex; align-items: center; padding: 10px 16px; background: var(--bgColor-muted); border-bottom: 1px solid var(--borderColor-muted); border-radius: 6px 6px 0 0; }
    .ghs .Box-header:first-child, .ghs .Box-body:first-child { border-radius: 6px 6px 0 0; }
    .ghs .Box-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .ghs .Box-body { padding: 16px; background: var(--bgColor-default); }
    .ghs .Box-row { display: flex; align-items: center; padding: 8px 16px; list-style: none; border-top: 1px solid var(--borderColor-muted); transition: background-color .15s ease, box-shadow .15s ease; }
    .ghs .Box-row:first-child { border-top: 0; }
    /* 原生 hover：新版仓库文件树非 .Box-row，主脚本增强不会命中文件列表 */
    .ghs .Box-row:hover { background: var(--bgColor-muted); }
    /* 主脚本增强仅作用于仍以 .Box-row 渲染的列表（Releases 资产行等） */
    .ghs .assets-list .Box-row:hover {
        background: var(--ghb-boxrow-hover-bg, var(--bgColor-accent-muted));
        box-shadow: inset 4px 0 0 var(--ghb-accent-bar, var(--fgColor-accent));
    }
    .ghs .Box-row .octicon { color: var(--fgColor-muted); flex-shrink: 0; }

    /* ── Truncate / 行内元素 ── */
    .ghs .Truncate { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
    .ghs .Truncate > .Truncate-text { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ghs kbd { font-family: ${GH_MONO}; font-size: 11px; padding: 2px 5px; border-radius: 5px; border: 1px solid var(--borderColor-default); color: var(--fgColor-muted); }

    /* ── 文件浏览列表（仓库根 / 列表流） ── */
    .ghs .file-list-name { flex: 1 1 340px; min-width: 0; display: flex; align-items: center; gap: 8px; }
    .ghs .file-list-msg { flex: 1 1 320px; min-width: 0; display: flex; align-items: center; gap: 6px; color: var(--fgColor-muted); font-size: 12px; }
    .ghs .file-list-date { flex: 0 0 100px; text-align: right; font-size: 12px; color: var(--fgColor-muted); }
    .ghs .mini-avatar {
        width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
        background: var(--bgColor-emphasis);
        box-shadow: 0 0 0 1px var(--avatar-borderColor);
    }

    /* ── 代码 / Blob ── */
    .ghs .blob-wrapper { overflow-x: auto; }
    .ghs .blob-code-table { width: 100%; border-collapse: collapse; font-family: ${GH_MONO}; font-size: 12.5px; line-height: 1.55; }
    .ghs .blob-code-table td { padding: 0; vertical-align: top; }
    .ghs .blob-num {
        width: 40px; min-width: 40px; padding: 0 14px 0 0; text-align: right;
        color: var(--fgColor-subtle); user-select: none; font-size: 12.5px;
        border-right: 1px solid var(--borderColor-muted); background: var(--bgColor-default);
    }
    .ghs .blob-code-inner { padding-left: 16px; color: var(--fgColor-default); white-space: pre; background: var(--bgColor-default); }
    .ghs .highlight { background: var(--bgColor-default); }
    .ghs .file-code-bg { background: var(--bgColor-default); }
    .ghs code { font-family: ${GH_MONO}; }

    /* prettylights 语法色（引擎输出 --color-prettylights-syntax-*） */
    .ghs .pl-c { color: var(--color-prettylights-syntax-comment); }
    .ghs .pl-c1 { color: var(--color-prettylights-syntax-constant); }
    .ghs .pl-en { color: var(--color-prettylights-syntax-entity); }
    .ghs .pl-ent { color: var(--color-prettylights-syntax-entity-tag); }
    .ghs .pl-k { color: var(--color-prettylights-syntax-keyword); }
    .ghs .pl-s { color: var(--color-prettylights-syntax-string); }
    .ghs .pl-smi { color: var(--color-prettylights-syntax-storage-modifier-import, var(--fgColor-default)); }
    .ghs .pl-v { color: var(--color-prettylights-syntax-variable); }
    .ghs .pl-pds { color: var(--color-prettylights-syntax-string); }

    /* ── Diff（GitHub 真实结构：blob-num × 2 + blob-code，符号在代码单元格内） ── */
    .ghs .diff-table { width: 100%; border-collapse: collapse; font-family: ${GH_MONO}; font-size: 12px; line-height: 20px; tab-size: 4; }
    .ghs .diff-table td { padding: 0 10px 0 0; vertical-align: top; white-space: pre; }
    .ghs .diff-table .blob-num {
        width: 1%; min-width: 44px; text-align: right;
        color: var(--fgColor-subtle); user-select: none;
        border-right: 1px solid var(--borderColor-muted);
    }
    .ghs .blob-num-deletion { background: var(--bgColor-danger-muted); color: var(--fgColor-danger); }
    .ghs .blob-num-addition { background: var(--bgColor-success-muted); color: var(--fgColor-success); }
    .ghs .blob-code-deletion { background: var(--bgColor-danger-muted); }
    .ghs .blob-code-addition { background: var(--bgColor-success-muted); }
    .ghs .blob-code-hunk {
        padding: 4px 10px; font-size: 12px;
        color: var(--fgColor-accent); background: var(--bgColor-accent-muted);
        white-space: pre;
    }
    .ghs .blob-code-inner { white-space: pre; }

    /* ── 页面内容容器 ── */
    .ghs .gh-content { padding: 24px; background: var(--bgColor-default); }
    .ghs .gh-content .inner { max-width: 980px; margin: 0 auto; }
    .ghs .page-title { font-size: 20px; font-weight: 600; color: var(--fgColor-default); line-height: 1.4; }

    /* ── README（markdown-body 子集） ── */
    .ghs .readme { font-size: 14px; line-height: 1.6; }
    .ghs .readme h2 {
        font-size: 20px; font-weight: 600; line-height: 1.4;
        padding-bottom: 8px; margin: 16px 0 12px;
        border-bottom: 1px solid var(--borderColor-muted);
        color: var(--fgColor-default);
    }
    .ghs .readme h2:first-child { margin-top: 0; }
    .ghs .readme p { margin: 0 0 12px; }
    .ghs .readme ul { margin: 0 0 12px; padding-left: 28px; list-style: disc; }
    .ghs .readme li { margin: 4px 0; }
    .ghs .readme li::marker { color: var(--fgColor-muted); }
    .ghs .readme code {
        font-family: ${GH_MONO}; font-size: 85%;
        padding: 2px 6px; border-radius: 6px;
        background: var(--bgColor-neutral-muted); color: var(--fgColor-default);
    }
    .ghs .readme blockquote {
        margin: 0 0 12px; padding: 0 12px;
        border-left: 3px solid var(--borderColor-default);
        color: var(--fgColor-muted);
    }

    /* Box-row 悬停增强演示保留原生分隔线（与主脚本一致） */
    .ghs .Box-row { border-radius: 0; }
`;

let pvShadow = null;   // ShadowRoot
let pvRootEl = null;   // .ghs 场景容器
let pvVarsEl = null;   // <style> 变量作用域

function ensurePreview() {
    const host = document.getElementById('device');
    if (!host) return;
    if (!host.shadowRoot) {
        const shadow = host.attachShadow({ mode: 'open' });
        const s1 = document.createElement('style');
        s1.textContent = PREVIEW_CSS;
        shadow.appendChild(s1);
        const s2 = document.createElement('style');
        s2.id = 'ghs-vars';
        shadow.appendChild(s2);
        const root = document.createElement('div');
        root.className = 'ghs';
        shadow.appendChild(root);
        pvShadow = shadow; pvRootEl = root; pvVarsEl = s2;
    }
}

    });

    const key = (state.key || 'my-theme').trim().replace(/['"]/g, '');
    const name = (state.name || '🎨 My Theme').trim().replace(/'/g, '\\\'');
    return `        // ── 你的新主题 ─ ${name}（GitHub Themes Studio 生成）──────────────
        '${key}': {
            name: '${name}',
            type: '${type}',
            tokens: {
${lines.join('\n')}
            }
        },`;
}

function updateOutput() {
    const code = genCode();
    const pre = document.getElementById('code-output');
    const empty = document.getElementById('code-empty');
    pre.textContent = code;
    pre.style.display = 'block';
    empty.style.display = 'none';
    const n = Object.keys(state.tokens).length;
    document.getElementById('gen-status').textContent = `${n} tokens · ${state.type}`;
}

/* ═══════════════════════════════════════════════════════════════
 *  8. 调度与事件
 * ═══════════════════════════════════════════════════════════════ */
function scheduleUpdate() {
    clearTimeout(timer);
    timer = setTimeout(() => { renderPreview(); updateOutput(); refreshCA(); }, 60);
}

function refreshCA() {
    const t = state.tokens;
    const ratio = contrast(t.fgDefault, t.bgDefault);
    const el = document.querySelector('.ca-badge[data-for="fgDefault-vs-bg"]');
    // 用 fgDefault 行展示整体正文对比
    if (el) {
        const lv = caLevel(ratio);
        el.className = 'ca-badge ' + lv.cls;
        el.textContent = '正文 ' + lv.txt;
        el.title = `fgDefault vs bgDefault 对比度 ${ratio.toFixed(2)} (AA 需 ≥4.5)`;
    }
    // fgOnEmphasis vs accent
    const el2 = document.querySelector('.ca-badge[data-for="fgOnEmphasis-vs-accent"]');
    if (el2) {
        const r2 = contrast(t.fgOnEmphasis, t.accent);
        const lv2 = caLevel(r2);
        el2.className = 'ca-badge ' + lv2.cls;
        el2.textContent = '按钮文字 ' + lv2.txt;
        el2.title = `fgOnEmphasis vs accent 对比度 ${r2.toFixed(2)} (AA 需 ≥4.5)`;
    }
}

function syncBaseSelect(key) {
    const sel = document.getElementById('base-select');
    if (sel) sel.value = (key && BASES[key] && !String(key).startsWith('blank')) ? key : '';
}

function setBase(name) {
    const base = BASES[name];
    if (!base) return;
    state.tokens = { ...base.tokens };
    state.key = base.key || '';
    state.name = base.name;
    state.type = base.type;
    document.getElementById('theme-key').value = state.key;
    document.getElementById('theme-name').value = state.name;
    document.querySelectorAll('#type-seg button').forEach(b => {
        b.classList.toggle('active', b.dataset.t === state.type);
    });
    syncBaseSelect(name);
    buildEditor();
    renderPreview();
    updateOutput();
    refreshCA();
}

function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => el.classList.remove('on'), 2200);
}

/* 复制 */
function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve, reject) => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); resolve(); }
        catch (e) { reject(e); }
        finally { ta.remove(); }
    });
}

/* 导出 JSON */
function toJSON() {
    return JSON.stringify({
        generator: 'github-themes-studio',
        version: '1.3.0.0',
        key: (state.key || '').trim(),
        name: state.name,
        type: state.type,
        tokens: state.tokens,
    }, null, 2);
}
function download(filename, text, mime) {
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}

/* 导入：解析 .json / .gh-theme；也兼容直接粘贴主题 JS 对象片段 */
function parseImport(text) {
    const s = text.trim();
    // JSON 直读
    try {
        const obj = JSON.parse(s);
        if (obj && obj.tokens) {
            return { key: obj.key || '', name: obj.name || '🎨 My Theme', type: obj.type === 'dark' ? 'dark' : 'light', tokens: obj.tokens };
        }
    } catch (e) { /* fallthrough */ }
    // JS 对象：形如 { name, type, tokens: { ... } }，或 'key': { ... }
    const src = s.replace(/^\s*'[^']*'\s*:\s*/, '');
    try {
        const fn = new Function('return (' + src + ');');
        const obj = fn();
        if (obj && obj.tokens) {
            const m = s.match(/^\s*'([^']+)'\s*:/);
            return { key: m ? m[1] : '', name: obj.name || '🎨 My Theme', type: obj.type === 'dark' ? 'dark' : 'light', tokens: obj.tokens };
        }
    } catch (e) { /* fallthrough */ }
    return null;
}

/* ═══════════════════════════════════════════════════════════════
 *  9. 绑定 UI 事件
 * ═══════════════════════════════════════════════════════════════ */
function bindUI() {
    // 类型分段
    document.querySelectorAll('#type-seg button').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#type-seg button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            state.type = btn.dataset.t;
            if (btn.dataset.t === 'light' && Object.values(state.tokens).every(v => v && isDark(v))) {
                // 深色值直接切浅色会不可读：提示用但不强制
            }
            scheduleUpdate();
        });
    });

    // key / name
    document.getElementById('theme-key').addEventListener('input', e => {
        state.key = e.target.value;
        updateOutput();
    });
    document.getElementById('theme-name').addEventListener('input', e => {
        state.name = e.target.value;
        scheduleUpdate();
    });

    // 基底下拉（全量对齐 GithubTheme.js 内置主题库）
    const baseSel = document.getElementById('base-select');
    const lights = [], darks = [];
    Object.entries(BASES).forEach(([k, b]) => {
        if (k.startsWith('blank')) return;
        (b.type === 'light' ? lights : darks).push([k, b.name]);
    });
    baseSel.innerHTML =
        '<option value="">选择基底主题…</option>' +
        `<optgroup label="☀️ 浅色 (${lights.length})">` + lights.map(([k, n]) => `<option value="${k}">${n}</option>`).join('') + '</optgroup>' +
        `<optgroup label="🌙 深色 (${darks.length})">` + darks.map(([k, n]) => `<option value="${k}">${n}</option>`).join('') + '</optgroup>';
    baseSel.addEventListener('change', () => {
        if (!baseSel.value) return;
        setBase(baseSel.value);
        showToast(`已载入 ${BASES[baseSel.value].name}`);
    });

    // 空白基底
    document.getElementById('btn-blank').addEventListener('click', () => {
        setBase(state.type === 'light' ? 'blank-light' : 'blank-dark');
        showToast('已清空为空白基底');
    });

    // 预览 tab
    document.querySelectorAll('#preview-tabs .ptab').forEach(p => {
        p.addEventListener('click', () => {
            document.querySelectorAll('#preview-tabs .ptab').forEach(x => x.classList.remove('active'));
            p.classList.add('active');
            state.activeTab = p.dataset.tab;
            renderPreview();
        });
    });

    // 复制 / 下载 / 导出（顶栏 + 底栏）
    const doCopy = () => {
        copyText(genCode()).then(() => showToast('配置块已复制到剪贴板 ✓'));
    };
    document.getElementById('btn-copy').addEventListener('click', doCopy);
    document.getElementById('btn-copy2').addEventListener('click', doCopy);

    const doExport = () => {
        download(`${(state.key || 'theme').trim() || 'theme'}.gh-theme.json`, toJSON(), 'application/json');
        showToast('已导出 JSON');
    };
    document.getElementById('btn-export').addEventListener('click', doExport);
    document.getElementById('btn-export2').addEventListener('click', doExport);

    document.getElementById('btn-download').addEventListener('click', () => {
        const code = `// GitHub Themes — 主题配置块（由 Studio 生成，粘贴进 GithubTheme.js themes 对象）\n` +
            `// 配合 v1.3.0.0 使用：18 语义 Token → 自动生成全部 Primer CSS 变量\n\n` +
            `const themes = {\n${genCode()}\n};\n`;
        download(`${(state.key || 'theme').trim() || 'theme'}-theme.js`, code, 'text/javascript');
        showToast('已下载 .js');
    });

    // 导入
    const importInput = document.createElement('input');
    importInput.type = 'file';
    importInput.accept = '.json,.gh-theme,.gh-theme.json,application/json';
    importInput.style.display = 'none';
    document.body.appendChild(importInput);
    document.getElementById('btn-import').addEventListener('click', () => importInput.click());
    importInput.addEventListener('change', () => {
        const file = importInput.files && importInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            const obj = parseImport(String(reader.result));
            if (!obj) { showToast('无法解析文件'); return; }
            state.tokens = { ...obj.tokens };
            state.key = obj.key || '';
            state.name = obj.name;
            state.type = obj.type;
            document.getElementById('theme-key').value = state.key;
            document.getElementById('theme-name').value = state.name;
            document.querySelectorAll('#type-seg button').forEach(b => b.classList.toggle('active', b.dataset.t === state.type));
            syncBaseSelect(state.key);
            buildEditor();
            renderPreview(); updateOutput(); refreshCA();
            showToast('导入成功 ✓');
        };
        reader.readAsText(file);
        importInput.value = '';
    });

    // 拖拽导入
    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', (e) => {
        e.preventDefault();
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            const obj = parseImport(String(reader.result));
            if (!obj) { showToast('无法解析文件'); return; }
            state.tokens = { ...obj.tokens };
            state.key = obj.key || '';
            state.name = obj.name;
            state.type = obj.type;
            document.getElementById('theme-key').value = state.key;
            document.getElementById('theme-name').value = state.name;
            document.querySelectorAll('#type-seg button').forEach(b => b.classList.toggle('active', b.dataset.t === state.type));
            syncBaseSelect(state.key);
            buildEditor();
            renderPreview(); updateOutput(); refreshCA();
            showToast('导入成功 ✓');
        };
        reader.readAsText(file);
    });

    // 快捷键
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            download(`${(state.key || 'theme').trim() || 'theme'}.gh-theme.json`, toJSON(), 'application/json');
            showToast('已保存 JSON');
        }
    });
}

/* ═══════════════════════════════════════════════════════════════
 *  10. 初始化
 * ═══════════════════════════════════════════════════════════════ */
buildEditor();
bindTokenEvents();
bindUI();
renderPreview();
updateOutput();
refreshCA();
</script>
</body>
